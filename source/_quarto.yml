project:
  output-dir: ../docs
  # The sessions only; the tutorials are a project of their own (tutorials/_quarto.yml)
  render:
    - "[0-9][0-9]_*.qmd"
    - "!tutorials/"

author: "Dr Massimiliano Canzi"

format:
  revealjs:
    theme: [dark, buttercup.scss]
    css: fonts.css
    embed-resources: true
    width: 1050
    height: 700
    incremental: true
    transition: fade
    background-transition: fade
    transition-speed: fast
    navigation-mode: linear
    slide-number: c/t
    show-slide-number: all
    controls: true
    touch: true
    menu: false
    center-title-slide: false
    auto-stretch: false
    highlight-style: zenburn
    code-line-numbers: false
    fig-width: 10
    fig-height: 4.4
    fig-align: center

execute:
  echo: true
  warning: false
  message: false

knitr:
  opts_chunk:
    comment: ""
    out.width: "100%"
